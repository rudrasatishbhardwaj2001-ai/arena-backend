<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Arena</title>
<style>
:root{--bg:#0d0f14;--c:#171a22;--t:#eef0f5;--m:#8b93a7;--a:#ff5a1f;--g:#22c55e}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:15px system-ui,sans-serif;padding-bottom:76px}
header{padding:14px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:var(--bg);z-index:5}
h1{margin:0;font-size:22px;letter-spacing:1px}h1 b{color:var(--a)}main{padding:0 16px;max-width:640px;margin:auto}
.card{background:linear-gradient(135deg,#1b1f2a,#14171e);border:1px solid #262b38;border-radius:16px;padding:14px;margin:12px 0;cursor:pointer}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}.muted{color:var(--m);font-size:13px;margin-top:4px}
.tag{background:var(--a);color:#fff;border-radius:8px;padding:2px 8px;font-size:12px;font-weight:700}
.bar{height:6px;background:#262b38;border-radius:9px;margin:10px 0 6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--a)}
input,select,textarea,button{font:inherit;width:100%;padding:12px;border-radius:12px;border:1px solid #2a3040;background:var(--c);color:var(--t);margin:6px 0}
button{background:var(--a);border:0;font-weight:700;cursor:pointer}button.alt{background:#262b38}button:disabled{opacity:.5}
.chips{display:flex;gap:8px;overflow-x:auto;margin:8px 0}.chips button{width:auto;padding:8px 14px;background:var(--c);border:1px solid #2a3040}.chips .on{background:var(--a)}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#10131a;border-top:1px solid #262b38;padding-bottom:env(safe-area-inset-bottom)}
nav button{background:none;border-radius:0;margin:0;color:var(--m);padding:16px 4px}nav .on{color:var(--a)}
#modal{position:fixed;inset:0;background:#000c;display:none;align-items:flex-end;z-index:9}#modal>div{background:var(--bg);width:100%;max-width:640px;margin:auto;border-radius:20px 20px 0 0;padding:18px;max-height:90vh;overflow:auto}
#toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:var(--g);color:#000;padding:10px 16px;border-radius:12px;display:none;z-index:20;font-weight:600}
small{color:var(--m)}
</style></head><body>
<header><h1>ARENA<b>.</b></h1><span id="who" class="muted"></span></header>
<main id="v"></main><div id="toast"></div><div id="modal" onclick="if(event.target===this)this.style.display='none'"><div id="mb"></div></div>
<nav id="nav"></nav>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let S={token:localStorage.t||'',user:JSON.parse(localStorage.u||'null'),list:[],mode:'ALL',q:'',view:'home'};
const canCreate=()=>S.user&&['creator','admin'].includes(S.user.role);
function toast(m,bad){const t=$('#toast');t.textContent=m;t.style.background=bad?'#ef4444':'#22c55e';t.style.display='block';setTimeout(()=>t.style.display='none',3000)}
async function api(p,body){const r=await fetch(p,{method:body?'POST':'GET',headers:{'Content-Type':'application/json',...(S.token?{Authorization:'Bearer '+S.token}:{})},body:body&&JSON.stringify(body)});
 const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'Something went wrong');return j}
function pay(o,done){if(!window.Razorpay)return toast('Payment script not loaded',1);
 new Razorpay({key:o.keyId,amount:o.amount,currency:'INR',order_id:o.orderId,name:'Arena',handler:async r=>{
  try{await api('/payments/verify',{orderId:r.razorpay_order_id,paymentId:r.razorpay_payment_id,signature:r.razorpay_signature});done()}catch(e){toast(e.message,1)}}}).open()}
function nav(){const items=[['home','Home'],...(canCreate()?[['create','Create']]:[]),['me','Profile']];
 $('#nav').innerHTML=items.map(([k,l])=>`<button class="${S.view===k?'on':''}" onclick="go('${k}')">${l}</button>`).join('');
 $('#who').textContent=S.user?S.user.name+' · '+S.user.role:''}
function go(v){S.view=v;nav();({home,create,me})[v]()}
const card=t=>`<div class="card" onclick="openT('${t.id}')"><div class="row"><b>${esc(t.name)}</b><span class="tag">${t.mode}</span></div>
<div class="muted">${new Date(t.starts_at).toLocaleString()}</div><div class="bar"><i style="width:${Math.min(100,t.registered/t.max_players*100)}%"></i></div>
<div class="row"><span>${t.registered} / ${t.max_players} Players</span><b>${t.entry_fee_paise?'₹'+t.entry_fee_paise/100:'Free'}</b></div>
<div class="muted">${t.prize_pool?'Prize: '+esc(t.prize_pool)+' · ':''}${t.status.replace('_',' ')}</div></div>`;
async function home(){$('#v').innerHTML='<p class="muted">Loading…</p>';
 try{S.list=await api('/tournaments')}catch(e){return $('#v').innerHTML='<p>Could not load tournaments. Try again.</p>'}drawList()}
function drawList(){const f=S.list.filter(t=>(S.mode==='ALL'||(S.mode==='LIVE'?t.status==='live':t.mode===S.mode))&&t.name.toLowerCase().includes(S.q.toLowerCase()));
 $('#v').innerHTML=`<input id="q" placeholder="Search tournaments" value="${esc(S.q)}" oninput="S.q=this.value;drawList();$('#q').focus()">
 <div class="chips">${['ALL','BR','CS','LIVE'].map(m=>`<button class="${S.mode===m?'on':''}" onclick="S.mode='${m}';drawList()">${m}</button>`).join('')}</div>
 ${f.map(card).join('')||'<p class="muted">No tournaments yet. Check back soon.</p>'}`}
function openT(id){const t=S.list.find(x=>x.id===id);const open=t.status==='registration_open';
 const lbl={full:'Tournament Full',completed:'Tournament Completed',live:'Registration Closed',cancelled:'Cancelled'}[t.status]||'Registration Closed';
 $('#mb').innerHTML=`<div class="row"><h2 style="margin:0">${esc(t.name)}</h2><span class="tag">${t.mode}</span></div>
 <p class="muted">Free Fire · ${new Date(t.starts_at).toLocaleString()}<br>Registration ends ${new Date(t.reg_end).toLocaleString()}<br>${t.registered} / ${t.max_players} players (min ${t.min_players})<br>Entry: ${t.entry_fee_paise?'₹'+t.entry_fee_paise/100:'Free'} · Prize: ${esc(t.prize_pool||'—')}</p>
 ${!open?`<button disabled>${lbl}</button>`:!S.user?'<button onclick="$(\'#modal\').style.display=\'none\';go(\'me\')">Sign in to join</button>':
 `<input id="uid" placeholder="Free Fire UID (numbers)" inputmode="numeric"><input id="nick" placeholder="Free Fire nickname"><button id="jb" onclick="join('${t.id}')">Join Tournament</button><small>Your ID is verified manually by the organiser.</small>`}`;
 $('#modal').style.display='flex'}
async function join(id){const b=$('#jb');b.disabled=true;
 try{const r=await api(`/tournaments/${id}/join`,{ffUid:$('#uid').value.trim(),nickname:$('#nick').value.trim()});
  if(r.order)pay(r.order,()=>{toast('Payment successful. You are registered!');$('#modal').style.display='none';home()});
  else{toast('Registered!');$('#modal').style.display='none';home()}}catch(e){toast(e.message.includes('Server')?'Check your UID (6–15 digits) and nickname':e.message,1)}b.disabled=false}
function create(){if(!canCreate()){$('#v').innerHTML='<h3>You need Creator Access to create tournaments.</h3><button onclick="go(\'me\')">Enter Creator Code</button>';return}
 $('#v').innerHTML=`<h2>Create Tournament</h2><input id="n" placeholder="Tournament name"><select id="m"><option>BR</option><option>CS</option></select>
 <small>Starts at</small><input id="s" type="datetime-local"><small>Registration opens</small><input id="rs" type="datetime-local"><small>Registration closes</small><input id="re" type="datetime-local">
 <input id="mn" type="number" placeholder="Min players"><input id="mx" type="number" placeholder="Max players"><input id="f" type="number" placeholder="Entry fee ₹ (0 = free)"><input id="p" placeholder="Prize pool (text)"><textarea id="r" rows="3" placeholder="Rules"></textarea>
 <button id="cb" onclick="mk()">${S.user.role==='admin'?'Publish Tournament':'Pay creator fee & Publish'}</button>`}
async function mk(){const b=$('#cb');b.disabled=true;const d=id=>new Date($('#'+id).value).toISOString();
 try{const c=await api('/tournaments',{name:$('#n').value,mode:$('#m').value,startsAt:d('s'),regStart:d('rs'),regEnd:d('re'),minPlayers:+$('#mn').value,maxPlayers:+$('#mx').value,
  entryFeePaise:Math.round(+$('#f').value*100),prizePool:$('#p').value||undefined,rules:$('#r').value||undefined});
  const pub=async()=>{await api(`/tournaments/${c.id}/publish`,{});toast('Published!');go('home')};
  if(S.user.role==='admin')await pub();else pay(await api(`/tournaments/${c.id}/creator-fee`,{}),()=>pub().catch(e=>toast(e.message,1)))
 }catch(e){toast(e.message.includes('Server')?'Please fill every field correctly':e.message,1)}b.disabled=false}
function me(){$('#v').innerHTML=S.user?`<h2>${esc(S.user.name)}</h2><p class="muted">${esc(S.user.email)} · role: ${S.user.role}</p>
 ${S.user.role==='player'?'<h3>Creator Access</h3><input id="cc" placeholder="Creator code"><button onclick="redeem()">Enter Creator Code</button>':''}
 <button class="alt" onclick="localStorage.clear();location.reload()">Sign out</button>`:'<h2>Sign in</h2><div id="gb"></div>';
 $('#v').innerHTML+=`<p><small>Participation and payments must comply with applicable laws, payment-provider rules and game publisher policies. This is not a betting or gambling platform. Terms, Privacy and Refund pages are coming soon.</small></p>`;
 if(!S.user)initG()}
async function redeem(){try{await api('/creator/redeem',{code:$('#cc').value});S.user.role='creator';localStorage.u=JSON.stringify(S.user);toast('Creator access unlocked');go('me')}catch(e){toast(e.message,1)}}
async function initG(){const {googleClientId}=await (await fetch('/config')).json();
 const t=setInterval(()=>{if(!window.google?.accounts)return;clearInterval(t);
  google.accounts.id.initialize({client_id:googleClientId,callback:async r=>{try{const j=await api('/auth/google',{idToken:r.credential});
   S.token=j.token;S.user=j.user;localStorage.t=j.token;localStorage.u=JSON.stringify(j.user);go('home')}catch(e){toast(e.message,1)}}});
  google.accounts.id.renderButton($('#gb'),{theme:'filled_black',size:'large'})},200)}
go('home');
</script></body></html>
